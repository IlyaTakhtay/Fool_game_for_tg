services:
  app:
    build:
      context: .
      dockerfile: ./build/dockerfile.dev
    volumes:
      - ./src:/app/backend/src
    networks:
      - fool_game_network
    ports:
      - "${APP_PORT}:8000"
    env_file:
      - .env
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "8"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z rabbitmq 5672 && nc -z postgres 5432 && nc -z redis 6379"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  fool_game_network:
    external: true
